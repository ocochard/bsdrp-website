site_name: BSD Router Project
site_url: https://bsdrp.net/
site_description: BSD Router Project — open source router distribution based on FreeBSD
site_author: The BSDRP Development Team
copyright: Copyright &copy; 2009-2026 The BSDRP Development Team

repo_url: https://github.com/ocochard/BSDRP
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/images/bsdrp-logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Downloads: downloads.md
  - About:
      - Features: features.md
      - License: license.md
      - Contributors: contributors.md
  - Documentation:
      - User Guide: documentation/end-users-docs.md
      - FAQ: documentation/faq.md
      - Technical Documentation:
          - Overview: documentation/technical-docs.md
          - Poudriere image: documentation/technical-docs/poudriere.md
          - NanoBSD: documentation/technical-docs/nanobsd.md
